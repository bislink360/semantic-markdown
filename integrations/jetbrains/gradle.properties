# The IDE the plugin compiles against when -PlocalIde=<folder of an installed IDE> is not given (CI, release).
# The plugin declares since-build 253 (2025.3), the first release whose IDEs all have the com.intellij.modules.lsp
# module it depends on, and uses only APIs that exist there.
platformVersion = 2025.3.2

kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
