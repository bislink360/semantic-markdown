# Release (old names): publishes a release under the names it had before 3.0 (Styled Markdown), so existing installs
# move to Semantic Markdown on their next update. Run it by hand (Actions → Release (old names) → Run workflow) after
# the Release workflow has published the same tag under the new names:
#
# - VS Code Marketplace and Open VSX: bislink360.styled-markdown, a stub (legacy/vscode) whose extensionDependencies
#   install bislink360.semantic-markdown.
# - npm: styled-markdown, the same package as semantic-markdown under the old name (legacy/npm/stage.mjs).
# - PyPI: mkdocs-styled-markdown, a stub that depends on mkdocs-semantic-markdown (legacy/pypi).
#
# `dry_run` (default on) builds and checks the three packages and publishes nothing. Each publish step skips with a
# notice while its secret is missing. A registry refuses a version it already lists, so publish each tag once.
name: Release (old names)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag already published under the new names (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Dry run (build and check only; nothing published)
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-legacy-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run }}
  NODE_VERSION: 22
  VSCE_VERSION: 3.9.2
  OVSX_VERSION: 1.2.0
  PYTHON_VERSION: '3.12'
  PYTHON_BUILD_VERSION: 1.2.2.post1
  TWINE_VERSION: 6.1.0

jobs:
  build:
    name: Build the old-name packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: The tag's version, in every old-name package
        id: version
        run: |
          version="${TAG#v}"
          node -e '
            const v = process.argv[1];
            const got = { "legacy/vscode": require("./legacy/vscode/package.json").version, extension: require("./extension/package.json").version };
            const toml = require("fs").readFileSync("legacy/pypi/pyproject.toml", "utf8");
            got["legacy/pypi"] = /^version = "([^"]*)"$/m.exec(toml)?.[1];
            got["legacy/pypi pin"] = /"mkdocs-semantic-markdown==([^"]*)"/.exec(toml)?.[1];
            const bad = Object.entries(got).filter(([, x]) => x !== v);
            if (bad.length) { console.error(`::error::Not at ${v}: ${bad.map(([k, x]) => `${k} (${x})`).join(", ")}`); process.exit(1); }
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: extension
        run: npm ci --no-audit --no-fund
      - name: npm package under the old name (.tgz)
        run: |
          mkdir -p legacy-assets
          (cd extension && npm run build:npm)
          node legacy/npm/stage.mjs staged/npm
          (cd staged/npm && npm pack --pack-destination ../../legacy-assets)
      - name: VS Code stub (.vsix)
        run: |
          mkdir -p staged/vscode
          cp -r legacy/vscode/. staged/vscode/
          cp LICENSE staged/vscode/LICENSE
          cp extension/media/icon.png staged/vscode/icon.png
          (cd staged/vscode && npx --yes "@vscode/vsce@$VSCE_VERSION" package --no-dependencies -o "../../legacy-assets/styled-markdown-${{ steps.version.outputs.version }}.vsix")
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: PyPI stub (wheel and sdist)
        run: |
          python -m pip install --disable-pip-version-check "build==$PYTHON_BUILD_VERSION"
          python -m build legacy/pypi --outdir legacy-assets
      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l legacy-assets
          for f in "styled-markdown-$VERSION.tgz" "styled-markdown-$VERSION.vsix" \
                   "mkdocs_styled_markdown-$VERSION-py3-none-any.whl" "mkdocs_styled_markdown-$VERSION.tar.gz"; do
            test -s "legacy-assets/$f" || { echo "::error::missing $f"; exit 1; }
          done
          tar -xOzf "legacy-assets/styled-markdown-$VERSION.tgz" package/package.json | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const p = JSON.parse(s);
              if (p.name !== "styled-markdown" || p.version !== process.argv[1] || p.mcpName) { console.error("::error::bad npm package.json"); process.exit(1); }
            });' "$VERSION"
          unzip -p "legacy-assets/styled-markdown-$VERSION.vsix" extension/package.json | grep -q '"bislink360.semantic-markdown"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-assets
          path: legacy-assets/
          if-no-files-found: error

  publish:
    name: Publish the old names
    needs: build
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # npm provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: legacy-assets
          path: legacy-assets
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice title=Marketplace::Skipped: VSCE_PAT is not set."; exit 0; fi
          npx --yes "@vscode/vsce@$VSCE_VERSION" publish --packagePath "legacy-assets/styled-markdown-$VERSION.vsix"
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice title=Open VSX::Skipped: OVSX_PAT is not set."; exit 0; fi
          npx --yes "ovsx@$OVSX_VERSION" publish "legacy-assets/styled-markdown-$VERSION.vsix"
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice title=npm::Skipped: NPM_TOKEN is not set."; exit 0; fi
          npm publish "./legacy-assets/styled-markdown-$VERSION.tgz" --provenance --access public
      - name: PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then echo "::notice title=PyPI::Skipped: PYPI_TOKEN is not set."; exit 0; fi
          python -m pip install --disable-pip-version-check "twine==$TWINE_VERSION"
          python -m twine upload --non-interactive legacy-assets/mkdocs_styled_markdown-*
